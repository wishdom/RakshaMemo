name: Release downloads

# Push v<version from Cargo.toml> to build all downloads and create a draft.
# Inspect the draft's assets, then publish it to activate README download links.
# Manual runs build artifacts for inspection without creating a release.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build ${{ matrix.label }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: Windows
            runner: windows-2022
            target: x86_64-pc-windows-msvc
            rustflags: '-C target-feature=+crt-static'
          - label: macOS Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
          - label: macOS Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin
          - label: Linux
            runner: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
    env:
      RUSTFLAGS: ${{ matrix.rustflags || '' }}
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Validate release version
        if: github.event_name == 'push'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python scripts/package-release.py check-version --tag "$RELEASE_TAG"
      - name: Install Rust
        run: |
          rustup toolchain install stable --profile minimal --target ${{ matrix.target }}
          rustup default stable
      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y pkg-config libwayland-dev libxkbcommon-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev libx11-dev libxi-dev libgl1-mesa-dev libssl-dev
      - name: Test
        run: cargo test --locked --target ${{ matrix.target }}
      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }}
      - name: Package download
        run: python scripts/package-release.py package --target ${{ matrix.target }}
      - uses: actions/upload-artifact@v7
        with:
          name: download-${{ matrix.target }}
          path: target/release-assets/*
          if-no-files-found: error
          retention-days: 14

  draft-release:
    name: Create draft release
    if: github.event_name == 'push'
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - uses: actions/download-artifact@v8
        with:
          pattern: download-*
          path: target/release-assets
          merge-multiple: true
      - name: Verify assets and calculate checksums
        run: python scripts/package-release.py checksums
      - name: Create draft with all downloads
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists; leaving it unchanged."
            exit 1
          fi
          gh release create "$RELEASE_TAG" target/release-assets/* \
            --verify-tag --draft --title "RakshaMemo $RELEASE_TAG" --generate-notes
