[package]
name = "rakshamemo"
version = "2.2.0"
edition = "2024"
rust-version = "1.99.0"
description = "RakshaMemo: local encrypted notes and passwords, written in Rust"
license = "MIT"

# The app's file is RakshaMemo.exe (RakshaMemo on Linux and macOS); the
# library keeps the conventional lowercase crate name, rakshamemo.
[[bin]]
name = "RakshaMemo"
path = "src/main.rs"

[dependencies]
anyhow = "1"
aes-gcm = { version = "0.11", features = ["zeroize"] }
aes = { version = "0.9", features = ["zeroize"] }
ghash = { version = "0.6", features = ["zeroize"] }
polyval = { version = "0.7", features = ["zeroize"] }
argon2 = { version = "0.6", features = ["zeroize"] }
arboard = { version = "3.6", default-features = false }
base64 = "0.23"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
dirs = "7"
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "glow", "wayland", "x11", "accesskit"] }
egui_extras = { version = "0.36.2", default-features = false }
fs2 = "0.4"
rand = "0.10"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
sys-locale = "0.3"
tempfile = "3"
uuid = { version = "1", features = ["v4"] }
zeroize = { version = "1", features = ["derive"] }
zxcvbn = "3"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_RemoteDesktop"] }
winreg = "0.56"

[profile.release]
lto = "thin"
strip = true

[build-dependencies]
embed-resource = "3"

